[project]
name = "imdb-wiki"
version = "0.1.0"
description = "Implementations of apparent age estimation methods revolving around the IMDB-WIKI dataset."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "imblearn>=0.0",
    "lightning>=2.5.5",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
]
