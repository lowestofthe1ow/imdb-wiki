[project]
name = "imdb-wiki"
version = "0.1.0"
description = "Implementations of apparent age estimation methods revolving around the IMDB-WIKI dataset."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "facenet-pytorch>=2.5.3",
    "imblearn>=0.0",
    "jupyter>=1.1.1",
    "kaggle>=1.7.4.5",
    "lab>=8.5",
    "lightning>=2.5.5",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "tqdm>=4.67.1",
    "umap>=0.1.1",
    "umap-learn>=0.5.9.post2",
]
